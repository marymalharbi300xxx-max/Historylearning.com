<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <meta name="description" content="Access your files, anywhere. Drive is a free way to keep your files safe.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- 1. THE DISGUISE (Tab Title and Logo) -->
  <title>Google Drive - My Files</title>
  <link rel="icon" type="image/x-icon" href="https://ssl.gstatic.com">
  
  <!-- 2. SAKURA DESIGN LINKS -->
  <link href="/css/style.css" rel="stylesheet" type="text/css" />
  <link href="/css/nav.css" rel="stylesheet" type="text/css" />
  <link href="https://fonts.googleapis.com" rel="stylesheet">
  
  <script>
    // This makes the background dark immediately like Sakura
    document.documentElement.style.backgroundColor = "#0d0d0d";
    
    // PANIC KEY: If you press "Escape", it goes to Google Classroom instantly!
    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") {
        window.location.replace("https://classroom.google.com");
      }
    });
  </script>

  <style>
    /* Sakura Loading Screen Style */
    .pageLoading {
      background: #0d0d0d;
      color: #ffb7c5;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 999;
    }
    .loading-text {
      margin-left: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }
  </style>
</head>

<body style="margin:0; overflow:hidden; background-color: #0d0d0d;">

  <!-- This is the part that actually runs the games/Roblox -->
  <iframe id="content-frame" src="/main.html" width="100%" height="100%" style="border:none; width:100vw; height:100vh;" frameborder="0"></iframe>
  
  <!-- This shows up while the site is starting -->
  <div class="pageLoading" id="loader">
    <img src="https://www.google.com" height="20px" style="filter: brightness(0) invert(1); opacity: 0.5;">
    <span class="loading-text">Syncing Drive...</span>
  </div>

  <script>
    // This removes the loading screen once the game page is ready
    window.onload = function() {
      setTimeout(function() {
        document.getElementById('loader').style.display = 'none';
      }, 1500);
    };
  </script>

  <!-- HIDDEN TEXT FOR FILTERS (Teachers see this if they check the code) -->
  <div style="opacity: 0.01; position: absolute; bottom: 0;">
    <h1>Educational Resource: ELA, Science, History, and Math</h1>
    <p>This directory contains academic files, research papers on George Washington, and quadratic formula worksheets for Period 4 Social Studies.</p>
  </div>

</body>
</html>
